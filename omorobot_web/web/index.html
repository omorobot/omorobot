<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMOROBOT Web</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark">O</div>
        <div class="brand-text">
          <strong>OMOROBOT</strong>
          <span id="brand-model">Web Console</span>
        </div>
      </div>
      <nav id="menu"></nav>
      <div class="sidebar-foot">
        <button id="teleop-toggle" class="side-button" type="button"></button>
      </div>
    </aside>
    <main id="main">
      <header id="topbar">
        <h1 id="page-title"></h1>
        <div id="status-chips"></div>
        <button id="estop" class="btn danger" type="button">비상 정지</button>
      </header>
      <section id="page"></section>
    </main>
  </div>
  <div id="teleop" hidden></div>
  <div id="toasts"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
